name: Crash Buy Monitor

on:
  schedule:
    - cron: "30 13 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "30 15 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crash-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_POWDER_SGD:     ${{ secrets.DRY_POWDER_SGD }}
          HEALTHCHECK_URL:    ${{ secrets.HEALTHCHECK_URL }}
          SEND_SUMMARY: ${{ (github.event_name != 'schedule' || github.event.schedule == '30 21 * * 1-5') && '1' || '0' }}
        run: python crash_monitor.py
      - name: Save updated state back to repo
        if: always()
        run: |
          git config user.name  "crash-monitor-bot"
          git config user.email "actions@github.com"
          git add monitor_state.json || true
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "Update monitor state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push retry $i..."
              sleep 3
            done
          fi
